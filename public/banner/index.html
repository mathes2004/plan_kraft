<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan Kraft interactive waterproofing demonstration</title>
    <link rel="stylesheet" href="banner.css" />
    <script src="controls.js" defer></script>
    <script src="scene.js" type="module"></script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"></path>
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="m2 8 10-5 10 5-10 5L2 8Zm0 5 10 5 10-5M2 18l10 5 10-5"></path>
      </symbol>
      <symbol id="i-drop" viewBox="0 0 24 24">
        <path d="M12 3S5 11 5 15a7 7 0 0 0 14 0c0-4-7-12-7-12Z"></path>
        <path d="M8 15a4 4 0 0 0 4 4"></path>
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"></path>
        <path d="m8 12 3 3 5-6"></path>
      </symbol>
      <symbol id="i-rain" viewBox="0 0 24 24">
        <path
          d="M6 14a5 5 0 1 1 2-10 6 6 0 0 1 11 4 3 3 0 0 1-1 6H6ZM8 18l-1 3m6-3-1 3m6-3-1 3"
        ></path>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7V5Z"></path></symbol>
    </svg>
    <div class="experience" id="experience">
      <div class="scene-topline">
        <span class="eyebrow">A LITTLE RAIN. A BIG DIFFERENCE.</span
        ><button
          class="icon-button"
          id="reset-scene"
          aria-label="Reset 3D house view"
          title="Reset view"
        >
          <svg><use href="#i-refresh"></use></svg>
        </button>
      </div>
      <div class="scene-wrap">
        <div class="scene-orbit orbit-one"></div>
        <div class="scene-orbit orbit-two"></div>
        <div
          id="roof-scene"
          aria-label="Interactive illustration of a waterproofed house in the rain"
          role="img"
        >
          <svg id="scene-fallback" viewBox="0 0 600 490" aria-hidden="true">
            <defs>
              <linearGradient id="wall" x2="1" y2="1">
                <stop stop-color="#ffffff"></stop>
                <stop offset="1" stop-color="#e4edf2"></stop>
              </linearGradient>
              <linearGradient id="glass" x2="1" y2="1">
                <stop stop-color="#255b78"></stop>
                <stop offset="1" stop-color="#88b4c9"></stop>
              </linearGradient>
              <filter id="shadow"><feGaussianBlur stdDeviation="15"></feGaussianBlur></filter>
            </defs>
            <ellipse
              cx="305"
              cy="411"
              rx="210"
              ry="22"
              fill="#004b73"
              opacity=".14"
              filter="url(#shadow)"
            ></ellipse>
            <path d="m75 327 268-84 190 90-268 109z" fill="#004b73"></path>
            <path d="m75 327 190 97 268-91v19l-268 97-190-102z" fill="#003754"></path>
            <path d="m140 219 198-70 119 61v137l-198 72-119-62z" fill="url(#wall)"></path>
            <path d="m140 219 119 58v142l-119-62z" fill="#edf3f7"></path>
            <path d="m135 210 204-72 124 65-204 76z" fill="#a8c52a"></path>
            <path d="m132 192 206-70 127 66v22l-206 72-127-65z" fill="#f6fafd"></path>
            <path
              class="fallback-membrane"
              d="m153 193 185-62 108 56-185 64z"
              fill="#c4d876"
            ></path>
            <g class="fallback-cracks" fill="none" stroke="#687664" stroke-width="2">
              <path d="m290 162 14 18-15 17 30 14 14-9 36 10m-50-1-11 23"></path>
            </g>
            <path d="m148 232 102 50v92l-102-50z" fill="url(#glass)"></path>
            <path d="m271 280 169-61v82l-169 62z" fill="url(#glass)"></path>
            <path d="m271 283 170-60v16l-170 62z" fill="#957652"></path>
            <path
              d="M173 246v90m24-78v91m26-78v93m70-90v80m41-95v81m43-97v80m40-94v80"
              stroke="#003754"
              stroke-width="4"
            ></path>
            <path d="m145 333 113 57 186-65v13l-186 66-113-57z" fill="#af9676"></path>
            <g fill="#527d39">
              <ellipse cx="464" cy="295" rx="23" ry="29"></ellipse>
              <ellipse cx="121" cy="307" rx="16" ry="25"></ellipse>
              <ellipse cx="386" cy="353" rx="16" ry="24"></ellipse>
            </g>
            <g class="fallback-leaks" fill="#90cddf">
              <ellipse cx="194" cy="292" rx="3" ry="9"></ellipse>
              <ellipse cx="211" cy="318" rx="3" ry="9"></ellipse>
              <ellipse cx="326" cy="296" rx="3" ry="9"></ellipse>
              <ellipse cx="351" cy="320" rx="3" ry="9"></ellipse>
            </g>
            <g class="fallback-rain" stroke="#c3e7ed" stroke-width="2" opacity=".7">
              <path
                d="m200 30-13 40m112-53-13 40m126-8-13 40M148 75l-13 40m235-15-13 40m131-32-13 40"
              ></path>
            </g>
          </svg>
        </div>
        <div class="protection-tag" id="protection-tag">
          <span class="status-dot"></span><span id="protection-label">Protected by Plan Kraft</span>
        </div>
        <div class="roof-label">
          <span class="annotation-line"></span
          ><span id="roof-label">A seamless protective layer</span>
        </div>
        <div class="scene-help">
          <svg><use href="#i-refresh"></use></svg> Drag or use arrow keys to explore
        </div>
        <button class="layer-control" id="layers-button" aria-pressed="false">
          <svg><use href="#i-layers"></use></svg><span>Explore layers</span>
        </button>
      </div>
      <div class="demo-panel">
        <div class="state-switch" role="group" aria-label="Compare waterproofing states">
          <button id="before-button" aria-pressed="false">
            <svg><use href="#i-drop"></use></svg> Before</button
          ><button id="after-button" class="active" aria-pressed="true">
            <svg><use href="#i-shield"></use></svg> With Plan Kraft
          </button>
        </div>
        <div class="rain-controls">
          <span
            ><svg><use href="#i-rain"></use></svg> Rainfall</span
          ><input
            type="range"
            id="rain-intensity"
            min="0"
            max="100"
            value="55"
            aria-label="Rainfall intensity"
            style=""
          /><button
            class="icon-button"
            id="pause-rain"
            aria-label="Pause rain"
            aria-pressed="false"
          >
            <svg><use href="#i-pause"></use></svg>
          </button>
        </div>
      </div>
      <p class="demo-caption" id="demo-caption" aria-live="polite">
        Rain meets protection. Your home stays dry.
      </p>
      <span class="illustration-note">Interactive system illustration</span>
    </div>
  </body>
</html>
